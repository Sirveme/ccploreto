<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Sin acceso · {{ org_nombre }}</title>
<style>
  :root{--bg:#0f1117;--card:#181a20;--border:rgba(255,255,255,.08);--text:#e8e8ed;--sec:#8b8d97;--accent:#6366f1}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;
       background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  .caja{background:var(--card);border:1px solid var(--border);border-radius:14px;max-width:440px;width:100%;
        padding:34px 28px;text-align:center;box-shadow:0 18px 50px rgba(0,0,0,.5)}
  .icono{width:64px;height:64px;margin:0 auto 16px;border-radius:50%;display:flex;align-items:center;justify-content:center;
         background:rgba(239,68,68,.12);color:#fca5a5;font-size:30px}
  h1{margin:0 0 8px;font-size:21px}
  p{margin:0 0 6px;color:var(--sec);font-size:14px;line-height:1.55;overflow-wrap:anywhere}
  .detalle{color:#c9cbd3}
  .acciones{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:22px}
  a,button{font:inherit;font-size:14px;font-weight:600;border-radius:9px;padding:10px 18px;cursor:pointer;text-decoration:none}
  .pri{background:#4f46e5;color:#eef2ff;border:0}
  .sec{background:transparent;color:#c9cbd3;border:1px solid var(--border)}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<main class="caja">
  <div class="icono" aria-hidden="true">✋</div>
  <h1>No tienes acceso a esta pantalla</h1>
  <p class="detalle">{{ detalle }}</p>
  <p>Si crees que deberías poder entrar, pídele al Administrador que revise tu rol.</p>
  <div class="acciones">
    <a class="pri" href="{{ panel_url }}">Ir a {{ panel_etiqueta }}</a>
    <button class="sec" type="button" id="btnAtras">Volver atrás</button>
  </div>
</main>
<script>
  document.getElementById("btnAtras").addEventListener("click", function () {
    if (history.length > 1) history.back(); else location.href = "{{ panel_url }}";
  });
</script>
</body>
</html>
