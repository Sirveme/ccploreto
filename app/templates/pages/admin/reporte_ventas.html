<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reporte de Ventas por Rango · CCPL</title>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#172033; --border:#334155;
    --ink:#e2e8f0; --muted:#94a3b8; --faint:#64748b;
    --accent:#a78bfa; --ok:#4ade80; --warn:#f9c64a; --bad:#f87171; --cyan:#38bdf8;
  }
  *{box-sizing:border-box}
  html{background:var(--bg);width:100%}
  body{margin:0;width:100%;min-height:100vh;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,Segoe UI,Roboto,sans-serif}
  .wrap{width:100%;max-width:1280px;margin:0 auto;padding:18px}
  h1{font-size:19px;margin:0 0 2px} .sub{color:var(--muted);font-size:12px;margin-bottom:16px}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:14px}
  .filtros{display:flex;flex-wrap:wrap;gap:10px;align-items:end}
  .f label{display:block;font-size:11px;color:var(--muted);margin-bottom:3px}
  input,select{background:var(--panel2);border:1px solid var(--border);color:var(--ink);border-radius:8px;padding:7px 9px;font-size:13px}
  button{background:var(--accent);color:#1a1033;border:0;border-radius:8px;padding:8px 16px;font-weight:700;cursor:pointer;font-size:13px}
  button:hover{filter:brightness(1.08)}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
  .kpi{background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:12px}
  .kpi .l{font-size:11px;color:var(--muted)} .kpi .v{font-size:22px;font-weight:800;margin-top:2px}
  .kpi.bad .v{color:var(--bad)} .kpi.ok .v{color:var(--ok)}
  .tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;max-width:100%}
  #detector{overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:13px}
  .tblwrap table,#detector table{min-width:520px}
  th,td{text-align:left;padding:7px 9px;border-bottom:1px solid var(--border);white-space:nowrap}
  th{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.3px}
  td.r,th.r{text-align:right} .mono{font-variant-numeric:tabular-nums}
  .tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
  .tab{background:var(--panel2);border:1px solid var(--border);color:var(--muted);padding:6px 13px;border-radius:999px;cursor:pointer;font-size:12px}
  .tab.on{background:var(--accent);color:#1a1033;font-weight:700;border-color:var(--accent)}
  .pane{display:none} .pane.on{display:block}
  .bridge{font-variant-numeric:tabular-nums;max-width:430px}
  .bridge .row{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px dashed var(--border)}
  .bridge .row.tot{border-bottom:0;border-top:2px solid var(--border);margin-top:4px;padding-top:7px;font-weight:800}
  .det-alert{border:1px solid var(--bad);background:rgba(248,113,113,.08)}
  .det-ok{border:1px solid var(--ok);background:rgba(74,222,128,.07)}
  .badge{display:inline-block;padding:1px 7px;border-radius:999px;font-size:11px}
  .b-no{background:rgba(248,113,113,.18);color:#fecaca} .b-si{background:rgba(74,222,128,.16);color:#bbf7d0}
  .b-sincdr{background:rgba(249,198,74,.16);color:#fde68a}
  .pill{color:var(--faint);font-size:11px}
  .muted{color:var(--muted)}
  @media(max-width:640px){.filtros{flex-direction:column;align-items:stretch}}
</style>
</head>
<body>
<div class="wrap">
  <h1>Reporte de Ventas por Rango</h1>
  <div class="sub">Colegio de Contadores Públicos de Loreto · solo lectura</div>

  <div class="card">
    <div class="filtros">
      <div class="f"><label>Desde</label><input type="date" id="desde"></div>
      <div class="f"><label>Hasta</label><input type="date" id="hasta"></div>
      <div class="f"><label>Método</label><select id="metodo">
        <option value="todos">Todos</option><option>efectivo</option><option>tarjeta</option>
        <option>transferencia</option><option>yape</option><option>plin</option><option>deposito</option><option>mixto</option></select></div>
      <div class="f"><label>Concepto</label><select id="concepto">
        <option value="todos">Todos</option><option>cuotas</option><option>extraordinarias</option>
        <option>multas</option><option>fraccionamiento</option><option>constancias</option>
        <option>derechos</option><option>eventos</option><option>mercaderia</option><option>otros</option></select></div>
      <div class="f"><label>Origen</label><select id="origen">
        <option value="todos">Todos</option><option value="caja_fisica">Caja física</option>
        <option value="externo_comunicado">Externo comunicado</option><option value="portal_openpay">Portal OpenPay</option></select></div>
      <div class="f"><button onclick="cargar()">Buscar</button></div>
    </div>
  </div>

  <div id="estado" class="muted" style="padding:6px 2px"></div>
  <div id="salida" style="display:none">
    <!-- KPIs -->
    <div class="card"><div class="kpis" id="kpis"></div></div>
    <!-- Puente + desgloses -->
    <div class="card">
      <div class="tabs">
        <div class="tab on" data-p="metodo" onclick="tab('metodo')">Por método</div>
        <div class="tab" data-p="concepto" onclick="tab('concepto')">Por concepto</div>
        <div class="tab" data-p="dia" onclick="tab('dia')">Por día</div>
        <div class="tab" data-p="puente" onclick="tab('puente')">Conciliación</div>
        <div class="tab" data-p="detalle" onclick="tab('detalle')">Detalle</div>
      </div>
      <div class="pane on" id="p-metodo"></div>
      <div class="pane" id="p-concepto"></div>
      <div class="pane" id="p-dia"></div>
      <div class="pane" id="p-puente"></div>
      <div class="pane" id="p-detalle"></div>
    </div>
  </div>
</div>

<script>
const S=n=>'S/ '+(Number(n||0)).toLocaleString('es-PE',{minimumFractionDigits:2,maximumFractionDigits:2});
function hoyISO(d){return d.toISOString().slice(0,10)}
(function initFechas(){
  const h=new Date(); const d=new Date(h.getFullYear(),h.getMonth(),1);
  document.getElementById('desde').value=hoyISO(d);
  document.getElementById('hasta').value=hoyISO(h);
})();
function tab(p){
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.p===p));
  document.querySelectorAll('.pane').forEach(x=>x.classList.toggle('on',x.id==='p-'+p));
}
async function cargar(){
  const q=new URLSearchParams({desde:desde.value,hasta:hasta.value,metodo:metodo.value,concepto:concepto.value,origen:origen.value});
  document.getElementById('estado').textContent='Consultando…';
  document.getElementById('salida').style.display='none';
  try{
    const r=await fetch('/api/reportes/ventas?'+q.toString(),{credentials:'same-origin'});
    if(!r.ok){document.getElementById('estado').textContent='Error '+r.status+': '+(await r.text()).slice(0,200);return;}
    render(await r.json());
  }catch(e){document.getElementById('estado').textContent='Error de red: '+e;}
}
function render(d){
  window.__REP=d;
  document.getElementById('estado').textContent='';
  document.getElementById('salida').style.display='block';
  // KPIs (reporte limpio: solo recaudación del arqueo)
  document.getElementById('kpis').innerHTML=`
    <div class="kpi ok"><div class="l">Total recaudado</div><div class="v mono">${S(d.totales.total_recaudado)}</div></div>
    <div class="kpi"><div class="l">N° de operaciones</div><div class="v">${d.totales.n_operaciones}</div></div>`;
  // Por método (+ mixto_referencia)
  const pm=d.por_metodo; let mh='<table><tr><th>Método</th><th class="r">Cant.</th><th class="r">Total</th></tr>';
  for(const k of Object.keys(pm)) mh+=`<tr><td>${k}</td><td class="r">${pm[k].cantidad}</td><td class="r mono">${S(pm[k].total)}</td></tr>`;
  mh+='</table>';
  let mnota = (d.mixto_referencia&&d.mixto_referencia.operaciones) ? `<div class="pill" style="margin-top:8px">ℹ ${d.mixto_referencia.nota}</div>` : '';
  document.getElementById('p-metodo').innerHTML='<div class="tblwrap">'+mh+'</div>'+mnota;
  // Por concepto
  const pc=d.por_concepto; let ch='<table><tr><th>Concepto</th><th class="r">Total</th></tr>';
  for(const k of Object.keys(pc)) ch+=`<tr><td>${k}</td><td class="r mono">${S(pc[k])}</td></tr>`;
  document.getElementById('p-concepto').innerHTML='<div class="tblwrap">'+ch+'</table></div>';
  // Por día
  const pd=d.por_dia; let dh='<table><tr><th>Día</th><th class="r">Ops</th><th class="r">Recaudado</th></tr>';
  for(const k of Object.keys(pd)) dh+=`<tr><td class="mono">${k}</td><td class="r">${pd[k].ops}</td><td class="r mono">${S(pd[k].recaudado)}</td></tr>`;
  document.getElementById('p-dia').innerHTML='<div class="tblwrap">'+dh+'</table></div>';
  // Puente
  const b=d.puente_conciliacion;
  document.getElementById('p-puente').innerHTML=`<div class="bridge">
    <div class="row"><span>Total Vista A (todo)</span><span class="mono">${S(b.total_vista_a)}</span></div>
    <div class="row"><span>− Externo comunicado</span><span class="mono">${S(b.menos_externo_comunicado)}</span></div>
    <div class="row"><span>− Portal OpenPay</span><span class="mono">${S(b.menos_portal_openpay)}</span></div>
    <div class="row"><span>− Pagos sin comprobante</span><span class="mono">${S(b.menos_sin_comprobante)}</span></div>
    <div class="row tot"><span>= Recaudación caja física</span><span class="mono">${S(b.recaudacion_caja_fisica)}</span></div>
    <div class="pill" style="margin-top:6px">Debe igualar la suma de los cierres de caja del rango.</div></div>`;
  // Detalle
  const det2=d.detalle; let th='<table><tr><th>Fecha</th><th>Hora</th><th>Colegiado</th><th>Concepto(s)</th><th>Método</th><th>Comprobante</th><th>Estado</th><th>Origen</th><th class="r">Monto</th></tr>';
  th+=det2.map(x=>`<tr><td class="mono">${x.fecha}</td><td>${x.hora}</td><td>${x.colegiado||''} <span class="pill">${x.matricula||''}</span></td><td>${x.conceptos}</td><td>${x.metodo}</td><td class="mono">${x.comprobante||'—'}</td><td>${x.estado_sunat||'—'}</td><td>${x.origen}</td><td class="r mono">${S(x.monto)}</td></tr>`).join('');
  document.getElementById('p-detalle').innerHTML='<div class="tblwrap">'+th+'</table></div>'+`<div class="pill" style="margin-top:6px">${det2.length} operación(es).</div>`;
}
// Autocarga: datos precargados (vista estática/demo) o, en la app, el mes actual al abrir.
if(window.__PRECARGA){render(window.__PRECARGA);}
else{try{cargar();}catch(e){}}
</script>
</body>
</html>
